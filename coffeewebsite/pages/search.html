<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(156, 67, 25);
            background-image: url(../images/bg.jpg);
            background-repeat: no-repeat;
            background-size: 150%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 97vh;
        }
        .card{
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            flex-wrap: nowrap;
            width: 30%;
            background-color: rgb(250, 199, 179);
            padding: 30px;
            border-radius: 20px;
            color: rgb(165, 91, 42);
            h1{
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: normal;
            }
            h3{
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            }
            p{
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            }
            button{
                padding: 20px 40px;
                border-radius: 10px;
                border: none;
                background-color: rgb(165, 91, 42);
                color: white;
            }
            button:hover{
                background-color: rgb(226, 126, 59);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>No results Found</h1>
        <h3>No coffee available. Check back later. Hehe</h3>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Soluta, officia doloribus et saepe aspernatur a suscipit fugiat laudantium recusandae. Cum dolor blanditiis libero nemo, repellendus rerum molestias repudiandae molestiae eius?</p>
        <a href="../index.html"><button>Go Back</button></a>
    </div>
</body>
</html>
